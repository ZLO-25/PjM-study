# mkdocs.yml
site_name: PjM 學習互動手冊
site_description: 從理論、心理、實作、案例四個角度，系統化學習專案管理 (Project Management)
# GitHub Pages 網址
site_url: https://zlo-25.github.io/PjM-study/
repo_url: https://github.com/ZLO-25/PjM-study
repo_name: ZLO-25/PjM-study
docs_dir: docs

theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs          # 頂部分頁：理論 / 心理 / 實作 / 案例
    - navigation.sections
    - navigation.indexes
    - navigation.top           # 回到頂端按鈕
    - navigation.footer        # 頁尾上一頁 / 下一頁
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link        # 同名分頁（入門/進階）全站同步切換
    - content.code.copy
  palette:
    # 跟隨系統設定
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切換為淺色模式
    # 淺色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換為深色模式
    # 深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 跟隨系統設定

plugins:
  - search:
      lang: en
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

markdown_extensions:
  - admonition               # !!! tip / !!! warning
  - pymdownx.details         # ??? 可折疊區塊（答案、提示）
  - pymdownx.superfences     # 區塊內可再放程式碼區塊
  - pymdownx.tabbed:         # === "入門" / === "進階"
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/ascii-align.js

